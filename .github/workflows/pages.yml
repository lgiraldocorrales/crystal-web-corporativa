name: Deploy Astro preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and LFS assets
        uses: actions/checkout@v5
        env:
          GIT_LFS_SKIP_SMUDGE: '1'

      - name: Fetch assets except videos
        run: git lfs pull --exclude="public/static/store/images/videos/**"

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Build static preview
        run: npm run build:pages
        env:
          PUBLIC_SITE_URL: https://lgiraldocorrales.github.io/crystal-web-corporativa
          PAGES_BASE_PATH: /crystal-web-corporativa
          PAGES_VIDEO_ORIGIN: https://www.crystal.com.co

      - name: Test preview and backend contracts
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
