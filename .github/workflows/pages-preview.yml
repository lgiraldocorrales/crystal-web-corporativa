name: Crystal static preview
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crystal-pages-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Fetch original local assets except videos
        run: git lfs pull --exclude="public/static/store/images/videos/**"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --import tsx --test tests/pages-preview.test.ts
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: /crystal-web-corporativa
          PAGES_VIDEO_ORIGIN: https://www.crystal.com.co
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static preview
        id: deployment
        uses: actions/deploy-pages@v4
